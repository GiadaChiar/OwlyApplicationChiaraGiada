name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # deploy automatico solo quando fai push su main
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del codice
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Installa le dipendenze
      - run: npm install

      # 4️⃣ Esegui la build (genera dist/)
      - run: npm run build

      # 5️⃣ Carica dist come artifact per GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 6️⃣ Deploy su GitHub Pages
      - uses: actions/deploy-pages@v1