name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Permetti anche l'esecuzione manuale
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy concorrenti
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1️⃣ Checkout del codice
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'  # Cache delle dipendenze npm

      # 3️⃣ Installa le dipendenze
      - name: Install dependencies
        run: npm ci  # Usa 'ci' invece di 'install' per CI/CD

      # 4️⃣ Build del progetto
      - name: Build project
        run: |
          npm run build
          echo "📁 Contenuto della cartella dist:"
          ls -la dist

      # 5️⃣ Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 7️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
